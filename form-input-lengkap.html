<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laporan Tindakan Cathlab — RSUD H. Abdul Manap</title>
<style>
:root{--ac:#0f766e;--ac2:#0d9488;--ink:#0f1e2b;--mu:#5b6b7a;--ln:#d6dde3;--bg:#eef2f4;
  --ok:#16a34a;--warn:#ea580c;--err:#dc2626;--neutral:#64748b;--card:#fff;--card2:#f8fafb}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:13px/1.5 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
button{font:inherit;font-size:13px;padding:7px 13px;border:1px solid var(--ln);border-radius:6px;background:#fff;cursor:pointer;color:inherit}
button:hover{background:#f5f7f9}
.b1{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.b1:hover{background:var(--ac2)}
.b2{background:#fff;border-color:var(--ac);color:var(--ac)}
.b3{background:#fff;border-color:var(--err);color:var(--err)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid #bcc7d0;border-radius:6px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:var(--ac)}
textarea{min-height:100px;resize:vertical;font-family:inherit}
label{display:block;font-size:11.5px;color:var(--mu);margin-bottom:3px;font-weight:500}

#topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln);padding:8px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#topbar .t{font-weight:600;font-size:14px}
#topbar .meta{color:var(--mu);font-size:12px}
#topbar .actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:600;background:#fef3c7;color:#92400e}
.badge.Final{background:#d1fae5;color:#065f46}
#sv{font-size:11px;color:var(--mu);transition:color .3s;min-width:80px}
#sv.saving{color:var(--warn)}
#sv.saved{color:var(--ok)}

#jump{position:sticky;top:56px;z-index:29;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln);padding:6px 20px;display:flex;gap:6px;overflow-x:auto;white-space:nowrap}
#jump::-webkit-scrollbar{height:4px}
#jump::-webkit-scrollbar-thumb{background:var(--ln);border-radius:2px}
#jump a{font-size:11.5px;padding:3px 10px;border:1px solid var(--ln);border-radius:12px;text-decoration:none;color:var(--ink);flex-shrink:0;cursor:pointer}
#jump a:hover{background:#f0fdfa;border-color:var(--ac);color:var(--ac)}
#jump a .st{display:inline-block;width:6px;height:6px;border-radius:50%;background:#cbd5e1;margin-left:5px;vertical-align:middle}
#jump a .st.ok{background:var(--ok)}
#jump a .st.warn{background:var(--warn)}
#jump a .st.err{background:var(--err)}

main{max-width:1000px;margin:14px auto;padding:0 16px}
.section{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px 18px;margin-bottom:14px;scroll-margin-top:110px}
.section h2{margin:0 0 4px;font-size:15px;color:var(--ac);display:flex;align-items:center;gap:8px}
.section h2 .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--ac);color:#fff;border-radius:50%;font-size:11px;font-weight:700}
.section .hint{font-size:11.5px;color:var(--mu);margin-bottom:12px}

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w2{grid-column:span 2}.w3{grid-column:span 3}.wf{grid-column:1/-1}
@media(max-width:700px){.w2,.w3{grid-column:auto}.g2{grid-template-columns:1fr}}

.fd.miss input,.fd.miss select,.fd.miss textarea{border-color:var(--err);background:#fef2f2}
.fd.warn input,.fd.warn select{border-color:var(--warn);background:#fffbeb}
.chs{display:flex;gap:6px;flex-wrap:wrap}
.ch{padding:5px 11px;border-radius:16px;border:1px solid var(--ln);background:#fff;cursor:pointer;font-size:12px}
.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ch.sm{padding:3px 9px;font-size:11px}
.card{border:1px solid var(--ln);border-radius:8px;padding:10px;background:var(--card2);margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:12.5px;color:var(--ac)}

.dgw{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dgw.single{grid-template-columns:1fr;max-width:560px;margin:0 auto}
@media(max-width:800px){.dgw{grid-template-columns:1fr}}
.box{border:1px solid var(--ln);border-radius:8px;padding:8px;background:#fafcfc}
.box h3{margin:0 0 6px;font-size:13px;text-align:center;color:var(--ac)}
.box .tools{display:flex;gap:4px;justify-content:center;margin-bottom:6px;flex-wrap:wrap}
.box .tools button{padding:3px 8px;font-size:11px}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
.seg{fill:none;stroke:#a3b0bb;stroke-width:5;stroke-linecap:round;cursor:pointer;transition:stroke-width .1s}
.seg:hover{stroke-width:9}
.seg.normal{stroke:#16a34a}
.seg.stenosis{stroke:#dc2626;stroke-dasharray:6 4}
.seg.stent{stroke:#2563eb;stroke-width:8}
.seg.thrombus{stroke:#ea580c;stroke-dasharray:2 3}
.seg.cto{stroke:#7f1d1d;stroke-dasharray:1 6}
.lb{font-size:9px;fill:#455;font-weight:600;pointer-events:none}
.lb.num{font-size:8px;fill:#789}
.hd{font-size:11px;fill:var(--ac);font-weight:700}
.lg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:6px}
.lg i{display:inline-block;width:14px;height:4px;margin-right:3px;vertical-align:middle;border-radius:2px}

.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:top}
th{background:#f5f7f9;font-weight:600;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
tr:last-child td{border-bottom:0}
td input,td select{padding:4px 6px;font-size:12px;min-width:50px}
td.tight{white-space:nowrap;width:1%}

.tl{display:flex;flex-direction:column;gap:6px}
.tl .vrow{display:grid;grid-template-columns:90px 1fr 1fr 1fr 1fr 1fr 40px;gap:6px;align-items:center}
@media(max-width:700px){.tl .vrow{grid-template-columns:1fr 1fr;gap:4px}}
.tl .vrow.header{font-size:11px;color:var(--mu);font-weight:600}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f1e2b;color:#fff;padding:10px 18px;border-radius:8px;z-index:200;display:none;max-width:90vw;font-size:13px;box-shadow:0 4px 20px #0003}
#toast.show{display:block}
.md{display:none;position:fixed;inset:0;background:#0006;z-index:100;align-items:center;justify-content:center;padding:16px}
.md.show{display:flex}
.mc{background:#fff;border-radius:10px;padding:18px;width:400px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px #0004}
.mc h3{margin:0 0 12px;font-size:15px;color:var(--ac)}
.mc .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.so{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.so button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

#fab{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
#fab button{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #0003;padding:0;font-size:16px}

#print{display:none}
body.pv #topbar,body.pv #jump,body.pv main,body.pv #fab{display:none}
body.pv #print{display:block}
#print{font:11px/1.4 Arial,sans-serif;color:#000;background:#fff;width:210mm;margin:40px auto;box-shadow:0 2px 12px #0004}
.pvbar{display:none;position:fixed;top:0;left:0;right:0;gap:8px;padding:8px 16px;background:#fff;z-index:60;border-bottom:1px solid var(--ln);align-items:center;flex-wrap:wrap}
body.pv .pvbar{display:flex}
.pvbar select{width:auto;padding:5px 8px}
.pvbar .sp{flex:1}

.pg{padding:12mm 14mm;min-height:297mm;page-break-after:always}
.pg:last-child{page-break-after:auto}
.kop{display:flex;gap:12px;align-items:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:10px}
.logo{width:62px;height:62px;border:1px dashed #999;font-size:9px;color:#999;display:flex;align-items:center;justify-content:center;text-align:center}
.kop .t{flex:1;font-weight:bold;font-size:14px;line-height:1.25}
.tr{display:flex;justify-content:space-between;gap:14px;margin-bottom:10px}
.pt{width:330px;border:1px solid #000;border-collapse:collapse}
.pt td{padding:1px 6px;vertical-align:top}
.pt td:first-child{font-weight:bold;width:92px}
.dt{border-top:1px solid #000;border-bottom:1px solid #000;border-collapse:collapse;width:100%}
.dt td{border-bottom:1px solid #ccc;padding:3px 5px;vertical-align:top}
.dt td:nth-child(odd){font-weight:bold;white-space:nowrap}
#print h4{margin:12px 0 5px;font-size:11.5px;text-transform:uppercase;border-bottom:1px solid #000;padding-bottom:2px}
.nr{white-space:pre-wrap;border:1px solid #bbb;padding:6px 8px;line-height:1.5;font-size:10.5px}
.lt,.lt td,.lt th{border:1px solid #666;padding:2px 5px;text-align:left;font-size:10px;border-collapse:collapse}
.lt th{background:#eee}
.ft{display:flex;justify-content:space-between;margin-top:18px}
.ft ol{margin:3px 0;padding-left:16px}
.ttd{text-align:center;min-width:220px}
.ttd img{height:60px;display:block;margin:2px auto}
.ttd .sp{height:60px}
.dp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dp.single{grid-template-columns:1fr;max-width:420px;margin:0 auto}
.dp svg{max-height:240px}
.dp b{display:block;text-align:center;margin-bottom:4px}
.vitals-tbl{width:100%;border-collapse:collapse;font-size:10px;margin:4px 0}
.vitals-tbl th,.vitals-tbl td{border:1px solid #999;padding:2px 4px}
@media print{
  body{background:#fff;padding:0}
  #topbar,#jump,main,.pvbar,.md,#toast,#fab{display:none!important}
  #print{display:block!important;box-shadow:none;margin:0;width:auto}
  @page{size:A4;margin:0}
  .pg{padding:12mm 14mm;min-height:0;page-break-after:always}
}
</style>
</head>
<body>

<div id="topbar">
  <div>
    <div class="t" id="tb-title">Laporan Tindakan Cathlab</div>

      <option value="full">Laporan Lengkap</option>
      <option value="summary">Ringkas 1 Halaman</option>

</div>

<script>
'use strict';
/* =========================================================
   STATE & UTILS
   ========================================================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const tgID=i=>{if(!i)return'-';const[y,m,d]=i.split('-');return `${+d} ${BLN[m-1]} ${y}`};

const SEG=[
  ["1","RCA prox",  "M 400 90 Q 420 130 425 175", 422, 130],
  ["2","RCA mid",   "M 425 175 Q 425 220 415 260", 422, 220],
  ["3","RCA distal","M 415 260 Q 400 300 380 320", 388, 305],
  ["4","PDA",       "M 415 260 Q 370 265 340 275", 365, 258],
  ["16","PLV",      "M 400 295 Q 370 300 350 305", 355, 322],
  ["16a","RPD",     "M 425 175 Q 460 170 480 175", 462, 168],
  ["16b","RPLV",    "M 415 260 Q 450 255 470 260", 452, 248],
  ["5","LM",        "M 180 60 Q 175 85 170 105", 185, 70],
  ["6","LAD prox",  "M 170 105 Q 150 140 130 180", 115, 150],
  ["7","LAD mid",   "M 130 180 Q 115 220 110 260", 80, 230],
  ["8","LAD dist",  "M 110 260 Q 105 290 115 315", 72, 300],
  ["9","D1",        "M 140 160 Q 175 175 200 200", 185, 190],
  ["10","D2",       "M 125 210 Q 155 230 175 255", 160, 240],
  ["11","LCX prox", "M 170 105 Q 220 115 250 140", 215, 125],
  ["12","OM1",      "M 250 145 Q 255 190 245 230", 235, 185],
  ["13","LCX mid",  "M 250 140 Q 280 165 295 200", 275, 180],
  ["14","OM2",      "M 285 185 Q 285 220 280 250", 288, 225],
  ["15","LCX dist", "M 295 200 Q 305 230 300 260", 295, 250]
];
const STATUS_LBL={normal:'Normal',stenosis:'Stenosis',stent:'Stent',thrombus:'Trombus',cto:'Oklusi total'};
const AKS=['Radialis kanan','Radialis kiri','Brachialis kanan','Brachialis kiri','Femoral kanan','Femoral kiri'];
const JENIS={
  'CAG'        :{phase:'single',label:'CAG'},
  'PCI / PPCI' :{phase:'dual',labelPre:'PRE PCI',labelPost:'POST PCI'},
  'Angiografi' :{phase:'single',label:'ANGIOGRAFI'},
  'FFR'        :{phase:'single',label:'FFR'},
  'IVUS / OCT' :{phase:'single',label:'IVUS / OCT'},
  'Rotablator' :{phase:'dual',labelPre:'PRE ROTABLATOR',labelPost:'POST ROTABLATOR'},
  'Lain-lain'  :{phase:'dual',labelPre:'',labelPost:''}
};
const TIMI=['','0','1','2','3'];
const KILLIP=['','I','II','III','IV'];
const CCS=['','I','II','III','IV'];
const COMPL_LIST=[
  {cat:'Akses',items:['Hematoma','Pseudoaneurisma','AV fistula','Perdarahan signifikan','Oklusi arteri','Disseksi arteri']},
  {cat:'Kardiak',items:['No-reflow','Perforasi koroner','Tamponade','AMI peri-prosedural','Aritmia VT/VF','Bradikardia berat','Henti jantung']},
  {cat:'Serebrovaskular',items:['TIA','Stroke iskemik','Stroke hemoragik']},
  {cat:'Renal',items:['AKI','Nefropati kontras']},
  {cat:'Alergi',items:['Reaksi kontras ringan','Reaksi kontras berat','Anafilaksis']},
  {cat:'Lain',items:['Mual/muntah','Vasovagal','Demam','Infeksi lokasi akses']}
];
const MED_TPL={
  heparin:{nama:'Heparin',dosis:'',rute:'IA/IV'},
  ntg:{nama:'NTG',dosis:'',rute:'IA'},
  gpi:{nama:'Tirofiban',dosis:'',rute:'IV'},
  aspilet:{nama:'Aspilet',dosis:'160 mg',rute:'PO'},
  clopidogrel:{nama:'Clopidogrel',dosis:'300 mg',rute:'PO'}
};

const blank=()=>({
  v:3,
  f:{rm:'',nama:'',reg:'',lahir:'',jk:'',umur:'',alamat:'',telp:'',penjamin:'BPJS Kesehatan',
    tglMasuk:today(),ruang:'Cathlab 1',kelas:'',dpjpMasuk:'',
    tgl:today(),mulai:nowTime(),selesai:'',tglSelesai:'',anestesi:'',
    jenis:'PCI / PPCI',labelPre:'PRE PCI',labelPost:'POST PCI',
    operator:'',operator2:'',fellow:'',resident:'',asisten:'',perawat:'',kolim:'',monitoring:'',
    diagnosaPre:'',indikasi:'',keluhan:'',riwayat:'',obatRutin:'',alergi:'-',
    consent:'Ya',puasa:'Ya',labHb:'',labPlt:'',labINR:'',labKreat:'',labGDS:'',labTrop:'',egk:'',echo:'',thorax:'',
    premedikasi:'',profilaksis:'',
    dom:'Right',timiPre:'',timiPost:'',killip:'',ccs:'',
    komplikasi:'Tidak ada',komplikasiList:[],komplikasiCatatan:'',
    kontras:'Hexiol',kontrasVol:'',radiasi:'',darah:'',
    td:'',hr:'',rr:'',suhu:'',spo2:'',urine:'',
    disposisi:'Rawat inap',followUp:'',obatPulang:'',edukasi:'',
    kesimpulan:'',narasi:'',
    ttdTgl:today(),ttdNama:'',temRm:1,temBpjs:1,temCath:1,temOp:1,temPasien:0},
  akses:[],vitals:[],meds:[],seg:{A:{},B:{}},stents:[],
  ttd:'',man:false,status:'Draft',audit:[]
});

const PASIEN_DB={
  '00051563':{nama:'DARMAWAN',reg:'2609030130',lahir:'1982-07-01',jk:'Laki-laki',
    alamat:'Jl. Merdeka No. 45, Jambi',telp:'0812-3456-7890',penjamin:'BPJS Kesehatan',
    dpjpMasuk:'dr. Puspita Sari Bustanul, Sp.JP',ruang:'Cathlab 1',kelas:'VIP'}
};
async function fetchPasien(rm){return PASIEN_DB[rm]||null}

/* =========================================================
   PERSISTENCE
   ========================================================= */
const KEY='cathlab:v3:current';
const HIST_KEY='cathlab:v3:history';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||blank();

let saveTimer;
function save(silent){
  clearTimeout(saveTimer);
  const ind=$('#sv');
  if(!silent){ind.textContent='Menyimpan…';ind.className='saving'}
  saveTimer=setTimeout(()=>{
    try{
      localStorage.setItem(KEY,JSON.stringify(S));
      if(S.f.rm){
        const hist=JSON.parse(localStorage.getItem(HIST_KEY)||'{}');
        const key=S.f.rm+'::'+S.f.tgl;
        if(!hist[key])hist[key]=[];
        const last=hist[key][hist[key].length-1];
        if(!last||JSON.stringify(last.data)!==JSON.stringify(S)){
          hist[key].push({t:Date.now(),data:JSON.parse(JSON.stringify(S))});
          if(hist[key].length>20)hist[key].shift();
          localStorage.setItem(HIST_KEY,JSON.stringify(hist));
        }
      }
      ind.textContent='Tersimpan '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
      ind.className='saved';
      setTimeout(()=>ind.className='',3000);
    }catch(e){
      ind.textContent='Gagal';
      console.error(e);
    }
  },silent?50:600);
}
function snap(msg){S.audit.push({t:new Date().toISOString(),msg});if(S.audit.length>500)S.audit.shift()}

/* =========================================================
   HELPERS
   ========================================================= */
function isDual(){const j=JENIS[S.f.jenis]||JENIS['Lain-lain'];return j.phase==='dual'}
function labelFor(ph){
  if(isDual()){
    const v=ph==='A'?S.f.labelPre:S.f.labelPost;
    return (v&&v.trim())?v:(ph==='A'?'PRE':'POST');
  }
  return JENIS[S.f.jenis]?.label||'DIAGRAM';
}
function segKey(code,name){return code+' '+name}
function calcUmur(lahir,tgl){
  if(!lahir)return'';
  const [y,m,d]=lahir.split('-').map(Number);
  const ref=tgl?new Date(tgl):new Date();
  let u=ref.getFullYear()-y;
  if(ref.getMonth()+1<m||(ref.getMonth()+1===m&&ref.getDate()<d))u--;
  return u+' tahun';
}
function grp(name){
  if(name==='LM')return 'LM';
  if(/^LAD|^D/.test(name))return 'LAD';
  if(/^LCX|^OM/.test(name))return 'LCX';
  if(/^RCA|^PDA|^PLV|^RPD|^RPLV/.test(name))return 'RCA';
  return 'Lain';
}

/* =========================================================
   FORM BUILDERS
   ========================================================= */
function fd(k,l,t='text',x='',cls=''){
  const v=S.f[k]??'';
  return `<div class="fd ${cls}" data-w="${k}"><label>${esc(l)}</label><input data-k="${k}" type="${t}" value="${esc(v)}" ${x}></div>`;
}
function sl(k,l,opts,cls=''){
  const v=S.f[k]??'';
  return `<div class="fd ${cls}" data-w="${k}"><label>${esc(l)}</label><select data-k="${k}">${opts.map(o=>{
    const val=typeof o==='object'?o.v:o, lbl=typeof o==='object'?o.l:o;
    return `<option value="${esc(val)}" ${v===val?'selected':''}>${esc(lbl)}</option>`;
  }).join('')}</select></div>`;
}
function sec_wrap(id,title,hint,body){
  return `<section class="section" id="${id}">
    <h2><span class="n">${SECTIONS.findIndex(s=>s.id===id)+1}</span>${esc(title)}</h2>
    <div class="hint">${hint||''}</div>
    ${body}
  </section>`;
}

function renderJump(){
  $('#jump').innerHTML=SECTIONS.map((s,i)=>{
    return `<a data-jump="${s.id}">${i+1}. ${esc(s.title)}<span class="st" id="jst-${s.id}"></span></a>`;
  }).join('');
}
function renderAll(){
  const c=$('#sections');
  c.innerHTML=SECTIONS.map(s=>s.render()).join('');
  attachAkses();
  attachVitals();
  attachMeds();
  attachStent();
  attachDiagram();
  refreshDiagramFields();
  refreshNarNote();
  refreshHeader();
  calcJumpStatus();
  // restore narasi textarea
  const nt=$('#narasi');
  if(nt)nt.value=S.f.narasi||'';
}
function refreshHeader(){
  const f=S.f;
  $('#tb-title').textContent=f.nama?`${f.nama} — RM ${f.rm}`:'Laporan Tindakan Cathlab';
  $('#tb-meta').textContent=f.nama?`${f.jenis} · ${tgID(f.tgl)} · ${f.ruang||'-'}`:'Belum ada data';
  $('#status').textContent=S.status;
  $('#status').className='badge'+(S.status==='Final'?' Final':'');
}
function refreshDiagramFields(){
  const dual=isDual();
  const wPre=$('#wPre'),wPost=$('#wPost');
  if(wPre)wPre.style.display=dual?'':'none';
  if(wPost)wPost.style.display=dual?'':'none';
  const lp=document.querySelector('[data-k="labelPre"]');
  const lo=document.querySelector('[data-k="labelPost"]');
  if(lp)lp.value=S.f.labelPre||'';
  if(lo)lo.value=S.f.labelPost||'';
  attachDiagram();
}
function refreshNarNote(){
  const n=$('#narNote');if(n)n.textContent=S.man?'(narasi diedit manual — Auto untuk reset)':'';
}
function calcJumpStatus(){
  SECTIONS.forEach(s=>{
    let missing=0,warn=0;
    s.req.forEach(k=>{const v=S.f[k];if(!v||String(v).trim()==='')missing++});
    if(s.id==='s1'&&S.f.lahir&&!S.f.umur)warn++;
    if(s.id==='s3'&&!S.f.asisten)warn++;
    if(s.id==='s6'&&!S.akses.length)warn++;
    if(s.id==='s7'&&!S.vitals.length)warn++;
    if(s.id==='s8'&&!S.f.kontrasVol)warn++;
    if(s.id==='s13'&&!S.f.narasi)warn++;
    const el=$('#jst-'+s.id);
    if(!el)return;
    el.className='st';
    if(missing)el.classList.add('err');
    else if(warn)el.classList.add('warn');
    else el.classList.add('ok');
  });
}

  const phases=dual?['A','B']:['A'];
  wrap.innerHTML=phases.map(ph=>{
    const svg=`<svg viewBox="0 0 520 360" data-ph="${ph}">`+
      SEG.map(([code,name,d,x,y])=>{

    return `<div class="box">

        <span><i style="background:#2563eb"></i>Stent</span>

  }).join('');
}

/* =========================================================
   AUTO-GENERATE
   ========================================================= */
function segDesc(ph,grpName){
  const entries=SEG.filter(([c,n])=>grp(n)===grpName).map(([c,n])=>({n,s:(S.seg[ph]||{})[segKey(c,n)]}))
    .filter(x=>x.s&&x.s.s&&x.s.s!=='normal');
  if(!entries.length)return 'Normal';
  return entries.map(({n,s})=>{
    const parts=[STATUS_LBL[s.s]||s.s];
    if(s.p)parts.push(s.p+'%');
    parts.push(n.replace(grpName,'').trim()||n);
    if(s.n)parts.push('('+s.n+')');
    return parts.join(' ');
  }).join('; ');
}
function genNarasi(){
  const f=S.f,R=[];
  const aksesUtama=S.akses[0]?.site||f.akses||'-';
  R.push(`Tindakan antiseptik di daerah ${aksesUtama.toLowerCase()}.`);
  S.akses.forEach((a,i)=>{
    R.push(`Akses ${i+1}: ${a.site}, sheath ${a.sheath||'-'}F.${a.anestesi?' Anestesi lokal '+a.anestesi+'.':''}`);
  });
  if(f.kontras||f.kontrasVol)R.push(`Media kontras: ${f.kontras||'-'} total ${f.kontrasVol||'-'} cc.`);
  R.push(`Hasil angiografi distribusi ${f.dom||'Right'} Dominant:`);
  ['LM','LAD','LCX','RCA'].forEach(g=>R.push(`  ${g} : ${segDesc('A',g)}`));
  if(f.timiPre)R.push(`TIMI flow awal: ${f.timiPre}.`);
  if(S.stents.length){
    R.push(`PCI dilakukan:`);
    S.stents.forEach(s=>{
      R.push(`  - ${s.direct?'Direct stenting':'Pemasangan stent'} ${s.tipe||''} ${s.merek||''} ${s.dia||'?'}×${s.pan||'?'} mm di ${s.seg}${s.tek?' tekanan '+s.tek+' atm':''}${s.pd?' post dilatasi '+s.pd+' atm':''}.`);
    });
    if(f.timiPost)R.push(`Angiografi post stenting: TIMI ${f.timiPost} flow.`);
  }
  if(S.meds.length)R.push(`Obat diberikan: ${S.meds.map(m=>`${m.nama}${m.dosis?' '+m.dosis:''}${m.rute?' ('+m.rute+')':''}`).join(', ')}.`);
  const lastV=S.vitals[S.vitals.length-1];
  if(lastV)R.push(`Hemodinamik akhir: TD ${lastV.td||'-'} mmHg, HR ${lastV.hr||'-'} bpm, SpO₂ ${lastV.spo2||'-'}%, suhu ${lastV.suhu||'-'}°C.`);
  else if(f.td)R.push(`Hemodinamik: TD ${f.td} mmHg, HR ${f.hr||'-'} bpm.`);
  R.push(`Komplikasi: ${f.komplikasi==='Ada'?(f.komplikasiCatatan||S.f.komplikasiList.join(', ')||'ada'):'tidak ada'}.`);
  if(f.radiasi||f.darah)R.push(`Radiasi: ${f.radiasi||'-'} mGy. Perdarahan: ${f.darah||'-'} cc.`);
  return R.map((t,i)=>i===0?t:`${i}. ${t}`).join('\n');
}
function autoKesimpulan(){
  const v=new Set();
  SEG.forEach(([c,n])=>{
    const s=(S.seg.A||{})[segKey(c,n)];
    if(!s||!s.s)return;
    if(['cto','thrombus','stent'].includes(s.s)||(s.s==='stenosis'&&(parseInt(s.p)||100)>=50))v.add(grp(n));
  });
  const nv=[...v].filter(x=>x!=='LM'&&x!=='Lain').length;
  let t='Tidak ada stenosis signifikan.';
  if(nv||v.has('LM'))t=`CAD ${nv}VD${v.has('LM')?' + LM':''}`;
  if(S.stents.length)t+=`, post ${S.stents.length} ${S.stents[0].tipe||'stent'} ${S.stents[0].merek||''} di ${S.stents.map(s=>s.seg).join(', ')}`;
  return t.trim();
}

// INPUT: field
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k!==undefined){
    const k=t.dataset.k;
    S.f[k]=t.value;
    if(k==='narasi'){S.man=true;refreshNarNote()}
    if(k==='lahir')S.f.umur=calcUmur(S.f.lahir,S.f.tgl);
    if(k==='jenis'){
      const j=JENIS[t.value]||JENIS['Lain-lain'];
      if(j.phase==='dual'&&j.labelPre){S.f.labelPre=j.labelPre;S.f.labelPost=j.labelPost}
      refreshDiagramFields();
    }
    if(k==='labelPre'||k==='labelPost')attachDiagram();
    t.closest('.fd')?.classList.remove('miss','warn');
    autoSync();
    return;
  }
  if(t.dataset.ak!==undefined){
    const i=+t.dataset.ak,c=t.dataset.c;
    S.akses[i]={...S.akses[i],[c]:t.value};
    autoSync();return;
  }
  if(t.dataset.vt!==undefined){
    const i=+t.dataset.vt,c=t.dataset.c;
    S.vitals[i]={...S.vitals[i],[c]:t.value};
    // sync vital ke field utama
    const last=S.vitals[S.vitals.length-1];
    if(last){S.f.td=last.td||S.f.td;S.f.hr=last.hr||S.f.hr;S.f.rr=last.rr||S.f.rr;S.f.spo2=last.spo2||S.f.spo2;S.f.suhu=last.suhu||S.f.suhu}
    autoSync();return;
  }
  if(t.dataset.md!==undefined){
    const i=+t.dataset.md,c=t.dataset.c;
    S.meds[i]={...S.meds[i],[c]:t.value};
    autoSync();return;
  }
  if(t.dataset.st!==undefined){
    const i=+t.dataset.st,c=t.dataset.c;
    const val=t.type==='checkbox'?t.checked:t.value;
    S.stents[i]={...S.stents[i],[c]:val};
    if(c==='seg'){
      const code=val.split(' ')[0],name=val.split(' ').slice(1).join(' ');
      S.seg.B[segKey(code,name)]={s:'stent',p:'',n:[S.stents[i].merek,S.stents[i].dia&&S.stents[i].pan?S.stents[i].dia+'x'+S.stents[i].pan:''].filter(Boolean).join(' ').trim()};
      attachDiagram();
    }
    autoSync();return;
  }
});

// CHANGE: roster + select
document.addEventListener('change',e=>{
  const t=e.target;
  const k=t.dataset.k;
  if(k&&['operator','operator2','fellow','resident','asisten','perawat','monitoring','kolim','dpjpMasuk','ttdNama'].includes(k)&&t.value){
    const roster=JSON.parse(localStorage.getItem('cathlab:roster')||'[]');
    if(!roster.includes(t.value)){roster.push(t.value);localStorage.setItem('cathlab:roster',JSON.stringify(roster))}
    const dl=$('#dpjpList');
    if(dl)dl.innerHTML=roster.map(n=>`<option value="${esc(n)}">`).join('');
  }
  if(k==='jenis'){
    const j=JENIS[t.value]||JENIS['Lain-lain'];
    if(j.phase==='dual'&&j.labelPre){S.f.labelPre=j.labelPre;S.f.labelPost=j.labelPost}
    refreshDiagramFields();
    autoSync();
  }
  // TTD upload
  if(t.id==='ttdInput'){
    const r=new FileReader();
    r.onload=()=>{S.ttd=r.result;renderAll();save()};
    if(t.files[0])r.readAsDataURL(t.files[0]);
  }
  // import file
  if(t.id==='impf'){
    const r=new FileReader();
    r.onload=()=>{
      try{S=JSON.parse(r.result);renderAll();save();toast('Import berhasil.')}
      catch(x){toast('File JSON tidak valid.')}
    };
    if(t.files[0])r.readAsText(t.files[0]);
  }
});

// KEYDOWN: autoload RM
document.addEventListener('keydown',e=>{
  if(e.target.id==='rmInput'&&e.key==='Enter'){
    e.preventDefault();
    autoloadPasien();
    return;
  }
  if(e.target.matches('input,textarea,select'))return;
  if(e.ctrlKey||e.metaKey){
    if(e.key==='s'){e.preventDefault();save();toast('Disimpan.');return}
    if(e.key==='e'){e.preventDefault();exportJSON();return}
    if(e.key==='p'){e.preventDefault();openPreview();setTimeout(()=>window.print(),200);return}
  }
  if(e.key==='Escape')closeModal();
});

// CLICK: delegation
document.addEventListener('click',e=>{
  // 1. SVG segment
  const seg=e.target.closest('.seg');
  if(seg&&seg.dataset.code!==undefined&&seg.closest('svg')?.dataset.ph){
    openSegModal(seg.dataset.code,seg.dataset.name,seg.closest('svg').dataset.ph);
    return;
  }
  // 2. Jump nav
  const jump=e.target.closest('#jump a[data-jump]');
  if(jump){
    const el=document.getElementById(jump.dataset.jump);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  // 3. Button
  const b=e.target.closest('button');
  if(!b)return;
  // chips komplikasi
  if(b.dataset.compl){
    const i=S.f.komplikasiList.indexOf(b.dataset.compl);
    if(i<0)S.f.komplikasiList.push(b.dataset.compl);else S.f.komplikasiList.splice(i,1);
    b.classList.toggle('on');autoSync();return;
  }
  // chips tembusan
  if(b.dataset.tem){S.f[b.dataset.tem]=!S.f[b.dataset.tem];b.classList.toggle('on');autoSync();return}
  // diagram tools
  if(b.dataset.diag){
    const [ph,act]=b.dataset.diag.split('|');
    if(act==='normal'){
      SEG.forEach(([c,n])=>{S.seg[ph][segKey(c,n)]={s:'normal',p:'',n:''}});
    }else if(act==='clear'){
      S.seg[ph]={};
    }else if(act==='copy'){
      S.seg.B=JSON.parse(JSON.stringify(S.seg.A||{}));
    }
    attachDiagram();autoSync();return;
  }
  // action buttons
  const a=b.dataset.a;
  if(a==='addAkses'){S.akses.push({site:'Radialis kanan',sheath:'6',lokasi:'',anestesi:'Lidokain 2%',kompl:'-'});attachAkses();autoSync();return}
  if(a==='addVital'){S.vitals.push({t:nowTime(),td:'',hr:'',rr:'',spo2:'',suhu:''});attachVitals();autoSync();return}
  if(a==='addMed'){S.meds.push({t:nowTime(),nama:'',dosis:'',rute:'',ket:''});attachMeds();autoSync();return}
  if(a==='medTpl'){const tpl=MED_TPL[b.dataset.tpl];S.meds.push({t:nowTime(),...tpl});attachMeds();autoSync();return}
  if(a==='addStent'){S.stents.push({seg:'7 LAD mid',tipe:'DES',merek:'',dia:'',pan:'',tek:'',pd:'',lot:'',exp:'',direct:false});attachStent();attachDiagram();autoSync();return}
  if(a==='gen'){S.man=false;S.f.narasi=genNarasi();const el=$('#narasi');if(el)el.value=S.f.narasi;refreshNarNote();autoSync();return}
  if(a==='kes'){S.f.kesimpulan=autoKesimpulan();const inp=document.querySelector('[data-k="kesimpulan"]');if(inp)inp.value=S.f.kesimpulan;autoSync();return}
  if(a==='clrTtd'){S.ttd='';renderAll();autoSync();return}
  if(a==='demo'){if(confirm('Muat data contoh? Isian akan tertimpa.'))demo();return}
  if(a==='reset'){if(confirm('Hapus semua isian?')){S=blank();renderAll();save();toast('Form direset.')}return}
  if(a==='exp'){exportJSON();return}
  if(a==='imp'){$('#impf').click();return}
  if(a==='hist'){showHistory();return}
  if(a==='prev'){openPreview();return}
  if(a==='print'){openPreview();setTimeout(()=>window.print(),200);return}
  if(a==='back'){document.body.classList.remove('pv');return}
  if(a==='top'){window.scrollTo({top:0,behavior:'smooth'});return}
  // delete buttons
  if(b.dataset.delAk!==undefined){S.akses.splice(+b.dataset.delAk,1);attachAkses();autoSync();return}
  if(b.dataset.delVt!==undefined){S.vitals.splice(+b.dataset.delVt,1);attachVitals();autoSync();return}
  if(b.dataset.delMd!==undefined){S.meds.splice(+b.dataset.delMd,1);attachMeds();autoSync();return}
  if(b.dataset.delSt!==undefined){
    const s=S.stents[+b.dataset.delSt];
    if(s){const code=s.seg.split(' ')[0],name=s.seg.split(' ').slice(1).join(' ');delete S.seg.B[segKey(code,name)]}
    S.stents.splice(+b.dataset.delSt,1);attachStent();attachDiagram();autoSync();return;
  }
});

/* =========================================================

   ========================================================= */
async function autoloadPasien(){
  const rm=(S.f.rm||'').trim();
  if(!rm)return;
  const p=await fetchPasien(rm);
  if(!p){toast('Pasien tidak ditemukan. Isi manual.');return}
  Object.assign(S.f,p);
  S.f.umur=calcUmur(p.lahir,S.f.tgl);
  snap('Auto-load pasien RM '+rm);
  renderAll();save();
  toast('Data pasien dimuat.');
}

  $('#mc').innerHTML=`

      ${Object.entries(STATUS_LBL).map(([k,v])=>`<button type="button" class="${s.s===k?'on':''}" data-v="${k}">${v}</button>`).join('')}
    </div>
    <div style="margin-bottom:8px"><label>Derajat Stenosis (%)</label><input id="mP" value="${esc(s.p||'')}" placeholder="mis. 95-99"></div>
    <div style="margin-bottom:8px"><label>Catatan</label><input id="mN" value="${esc(s.n||'')}" placeholder="mis. thrombus gr IV"></div>

    </div>`;
  $('#md').classList.add('show');
  $('#soModal').onclick=ev=>{const bt=ev.target.closest('button');if(!bt)return;$$('#soModal button').forEach(x=>x.classList.toggle('on',x===bt))};
  $('#mX').onclick=closeModal;

  $('#mOk').onclick=()=>{

/* =========================================================
   EXPORT / HISTORY
   ========================================================= */
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`cathlab_${S.f.rm||'draft'}_${S.f.tgl}.json`;
  a.click();
  snap('Export JSON');save();
  toast('File JSON diunduh.');
}
function showHistory(){
  if(!S.f.rm){toast('Isi No. RM dulu.');return}
  const hist=JSON.parse(localStorage.getItem(HIST_KEY)||'{}');
  const key=S.f.rm+'::'+S.f.tgl;
  const arr=hist[key]||[];
  $('#mc').innerHTML=`
    <h3>Riwayat Versi — RM ${esc(S.f.rm)}</h3>
    <p style="font-size:12px;color:var(--mu)">Snapshot otomatis (maks. 20 per RM).</p>
    <div style="max-height:400px;overflow-y:auto">
      ${arr.length?arr.map((h,i)=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <div><b>Versi ${i+1}</b><br><span style="font-size:11px;color:var(--mu)">${new Date(h.t).toLocaleString('id-ID')}</span></div>
        <div><button type="button" data-restore="${i}">Pulihkan</button></div>
      </div>`).reverse().join(''):'<p style="color:var(--mu)">Belum ada snapshot.</p>'}
    </div>
    <div class="acts"><button type="button" onclick="document.getElementById('md').classList.remove('show')">Tutup</button></div>`;
  $('#md').classList.add('show');
  $('#mc').onclick=e=>{
    const b=e.target.closest('[data-restore]');if(!b)return;
    const idx=+b.dataset.restore;
    if(!confirm('Pulihkan versi ini?'))return;
    S=JSON.parse(JSON.stringify(arr[idx].data));
    renderAll();save();closeModal();
    toast('Versi dipulihkan.');
  };
}

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}
